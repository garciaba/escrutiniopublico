# Continuous integration (specification, section 9; decision D-035). On every push:
# types, lint, format, tests with coverage, the reproducibility test, the website
# build with its audit, browser checks (axe-core, ranking table, privacy, stale-data
# warning) and Lighthouse. Branches other than main get a preview deployment on
# Cloudflare Pages. On main, once every check has passed, the site is deployed to
# production with the data already in the repository: a change of the website is
# published without waiting for the daily pipeline (decision D-039).
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Types, lint, format and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Tests with coverage (at least 90 % in pipeline/metrics and pipeline/normalize)
        run: pnpm test:coverage

  web:
    name: Website
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # /cambios lists the latest data commits.
          fetch-depth: 50
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:build
      - run: pnpm web:audit
      - name: Install Playwright with Chromium
        run: |
          npm install --global playwright@1.64.1
          npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Browser checks
        run: NODE_PATH="$(npm root --global)" pnpm web:check
      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=web/lighthouserc.json
      # Dependabot runs get no repository secrets, so they cannot deploy a preview.
      - name: Preview deployment
        if: github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/scripts/pages-deploy.sh "${{ github.ref_name }}"

      - name: Production deployment
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: .github/scripts/pages-deploy.sh main
