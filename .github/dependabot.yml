# Monthly, grouped dependency updates (specification, section 1). New versions wait
# two weeks before Dependabot proposes them, as the project's pinning policy asks.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      dependencies:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
